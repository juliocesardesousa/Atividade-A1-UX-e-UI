
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="../Css/Cadastro.css">
  <link rel="stylesheet" href="../Css/Uilities.css">
  <link rel="stylesheet" href="../Css/Footer.css">
  <link rel="stylesheet" href="../Css/Header.css">
</head>
<body>
  <!-- HEADER -->
  <header class="nav-bar">
    
    <nav>
      <ul class="nav-links" aria-label="Lista de links">
        <div class="logo">HABIT</div>
        <li><a href="#">Início</a></li>
        <li><a href="#">Páginas</a></li>
        <li><a href="#">Destaques</a></li>
        <li><a href="#">Assinar</a></li>
        <li><a href="#">Admin</a></li>
      </ul>
    </nav>
    <div class="buscador">
      <input type="text" placeholder="Buscar">
      <button class="btn" aria-label="Buscar" >Buscar</button>
      <button class="btn" aria-label="Entrar" >Entrar</button>
    </div>
  </header>


  <!-- MAIN -->
  <main class="principal">
    <div class="div-cadastro">

      <h1>Criar Conta</h1>
      <input type="text" placeholder="Nome completo ">
      <input type="text" placeholder="E-mail">
      <input type="password" placeholder="Senha">
      <input type="password" placeholder="Confirmar senha">
      
      <div id="cadastro">
        <input type="checkbox" id="termos" name="termos">
        <label for="termos">Concordo com os termos de políticas de segurança </label>
      </div>

      <button class="btn">Cadastrar</button>
      

    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="rodape">
        <button class="btn-outros">Instagram</button>
        <button class="btn-outros">Work</button>
        <button class="btn-outros">Bags</button>
        <button class="btn-outros">Lamp</button>
        <button class="btn-outros">Books</button>
    </div>
    <p>2025 Meu Site ° Meu Site</p>
  </footer>
</body>
</html>
