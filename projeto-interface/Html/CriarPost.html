<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Post</title>
    <link rel="stylesheet" href="../Css/Header.css">
    <link rel="stylesheet" href="../Css/Footer.css">
    <link rel="stylesheet" href="../Css/CriarPost.css">
    <link rel="stylesheet" href="../Css/Uilities.css">
</head>
<body>
        <!-- HEADER -->
  <header class="nav-bar">
    
    <nav>
      <ul class="nav-links">
        <div class="logo">HABIT</div>
        <li><a href="#">Início</a></li>
        <li><a href="#">Páginas</a></li>
        <li><a href="#">Destaques</a></li>
        <li><a href="#">Assinar</a></li>
        <li><a href="#">Admin</a></li>
      </ul>
    </nav>
    <div class="buscador">
      <input type="text" placeholder="Buscar">
      <button class="btn">Buscar</button>
      <button class="btn">Entrar</button>
    </div>
  </header>
        <!--MAIN -->

<main class="principal">
    <nav class="nav-menu">
        <h2>Menu</h2>
        <ul>
            <li><a href="#">Categorias</a></li>
            <li><a href="#">Criar Post</a></li>
            <li><a href="#">Escolhas do Editor</a></li>
            <li><a href="#">Usuários</a></li>
            <li><a href="#">Fila de Revisão</a></li>
            <li><a href="#">Fila de Comentários</a></li>

        </ul>
    </nav>

    <header class="header-valores">
        <div>
            <p>Posts</p>
            <h3>128</h3>
        </div>
        <div>
            <p>Visualizações</p>
            <h3>54K</h3>
        </div>
        <div>
            <p>Inscritos</p>
            <h3>12K</h3>
        </div>
        <div>
            <p>Pendência</p>
            <h3>1.2K</h3>
        </div>
    </header>

    <section>
        <h2>Criar Post</h2>
        <div>
            <input class="input-titulo" type="text" placeholder="Título">
            <input class="input-conteudo" type="text" placeholder="Escrever aqui... (Editor simulador)">
            
            <div class="div-inputs">
                <input class="input-categoria" type="text" placeholder="Categoria e tags">
                <input class="input-imagem" type="text" placeholder="Upload da imagem de capa">
            </div>
            
            <div class="div-btn-criar-post">
                <button class="btn">Salvar rascunho</button>
                <button class="btn">Enviar para a revisão</button>
                <button class="btn">Publicar (admin)</button>
            </div>
        </div>

    </section>
</main>

<!-- FOOTER -->
  <footer>
    <div class="rodape">
        <button class="btn-outros">Instagram</button>
        <button class="btn-outros">Work</button>
        <button class="btn-outros">Bags</button>
        <button class="btn-outros">Lamp</button>
        <button class="btn-outros">Books</button>
    </div>
    <p>2025 Meu Site ° Meu Site</p>
  </footer>
</body>
</html>
